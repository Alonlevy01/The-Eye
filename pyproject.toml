[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-eye"
version = "0.1.0"
description = "CS2 gameplay visual & audio analyzer with OpenCV HUD detection, librosa combat audio fusion, and VLM tactical coaching."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "librosa>=0.11.0",
    "numpy>=2.1.0",
    "opencv-python-headless>=4.10.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "soundfile>=0.13.0",
    "typer>=0.15.0",
    "yt-dlp>=2025.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[project.scripts]
the-eye = "the_eye.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/the_eye"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
